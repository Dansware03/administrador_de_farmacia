<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SIMAP - Documentación Técnica del Sistema</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Manual de Arquitectura y Documentación Técnica de SIMAP (Clínica Popular Especializada La Fría)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/libs/img/logo.png">
  <!-- Tema Docsify Limpio y Moderno -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0284c7;
    }
    .app-name-link img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #0f172a;
    }
    .markdown-section code {
      border-radius: 4px;
      background: #f1f5f9;
      color: #0369a1;
      padding: 2px 6px;
    }
    /* Botón flotante para imprimir en PDF */
    .btn-print-pdf {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      transition: all 0.2s ease;
    }
    .btn-print-pdf:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }
    @media print {
      .btn-print-pdf, .sidebar, .sidebar-toggle {
        display: none !important;
      }
      .content {
        left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Cargando documentación de SIMAP...</div>

  <!-- Botón de Exportar a PDF -->
  <button class="btn-print-pdf" onclick="window.open('manual_tecnico.html', '_blank')">
    📄 Ver Manual Imprimible / Exportar PDF
  </button>

  <script>
    window.$docsify = {
      name: 'SIMAP Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Motores Docsify y Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
