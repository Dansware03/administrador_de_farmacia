<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SIMAP - Documentación Técnica del Sistema</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Manual de Arquitectura y Documentación Técnica de SIMAP (Clínica Popular Especializada La Fría)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/libs/img/logo.png">
  <!-- Fuentes e iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema Docsify Limpio y Moderno -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0284c7;
      --heading-color: #0f172a;
      --text-color: #334155;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      letter-spacing: -0.01em;
    }
    .app-name-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #0f172a !important;
      font-size: 1.1rem;
      padding: 10px 0;
    }
    .app-name-link img {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .sidebar ul li a {
      font-weight: 500;
      color: #475569;
      padding: 6px 0;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .sidebar ul li.active > a {
      color: #0284c7;
      font-weight: 700;
    }
    .markdown-section {
      max-width: 960px;
      padding: 30px 45px 60px;
    }
    .markdown-section h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--heading-color);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-top: 1rem;
    }
    .markdown-section h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--heading-color);
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
      margin-top: 2rem;
    }
    .markdown-section h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e293b;
      margin-top: 1.5rem;
    }
    .markdown-section blockquote {
      border-left: 4px solid #0284c7;
      background: #f0f9ff;
      border-radius: 0 8px 8px 0;
      color: #0369a1;
      padding: 12px 18px;
      margin: 1.2rem 0;
    }
    .markdown-section blockquote p {
      margin: 0;
      font-weight: 500;
    }
    .markdown-section code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      border-radius: 5px;
      background: #f1f5f9;
      color: #0369a1;
      padding: 3px 6px;
      font-weight: 500;
    }
    .markdown-section pre > code {
      background: #0f172a;
      color: #f8fafc;
      padding: 1rem 1.2rem;
      border-radius: 8px;
    }
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      font-size: 0.92rem;
    }
    .markdown-section th {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .markdown-section td {
      border: 1px solid #e2e8f0;
      padding: 9px 14px;
      color: #334155;
    }
    .markdown-section tr:nth-child(even) {
      background: #fafbfc;
    }
    /* Botón flotante para imprimir en PDF */
    .btn-print-pdf {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.92rem;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-print-pdf:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.45);
    }
    @media print {
      .btn-print-pdf, .sidebar, .sidebar-toggle {
        display: none !important;
      }
      .content {
        left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Cargando documentación técnica de SIMAP...</div>

  <!-- Botón de Exportar a PDF -->
  <button class="btn-print-pdf" onclick="window.open('manual_tecnico.html', '_blank')">
    📄 Ver Manual Imprimible / Exportar PDF
  </button>

  <script>
    window.$docsify = {
      name: 'SIMAP Docs',
      logo: '../assets/libs/img/logo.png',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Motores Docsify y Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
